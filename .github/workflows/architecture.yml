name: Architecture and backend tests

# Runs on every pull request (the main CI only covers main and next) so modernization work is checked as it lands.
# See docs/ARCHITECTURE.md (the rules) and docs/MODERNIZATION.md (the plan).
on:
  pull_request:
  push:
    branches: [ modernization ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-asyncio import-linter==2.15

    - name: Import rules (ratchet)
      run: PYTHONPATH=. lint-imports

    - name: Backend tests
      run: python -m pytest tests/ -q --tb=short
