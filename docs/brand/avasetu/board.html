<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Hind:wght@500;600&display=swap">
<style>
body{margin:0;font-family:"Hind",sans-serif}
.s{position:relative;overflow:hidden}
.navy{background:#102340;color:#fff}
.word{font-family:"Baloo 2",sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1}
.gold{color:#F0B13B}
</style></head><body>
<!-- profile 1080 -->
<div id="profile" class="s" style="width:1080px;height:1080px;background:#102340;display:grid;place-items:center">
  <img src="mark.svg" style="width:820px;height:820px">
</div>
<!-- og 1200x630 -->
<div id="og" class="s navy" style="width:1200px;height:630px;display:flex;align-items:center;gap:56px;padding:0 90px;box-sizing:border-box">
  <img src="mark.svg" style="width:300px;height:300px;flex:none">
  <div><div class="word" style="font-size:132px">Avasetu</div>
  <div style="font-size:42px;margin-top:18px;font-weight:600">Your bridge to the <span class="gold">right home</span></div>
  <div style="font-size:28px;margin-top:22px;opacity:.8">Homes, guides and trusted local agents · Pune</div></div>
</div>
<!-- facebook cover 1640x624 (safe centre) -->
<div id="cover" class="s navy" style="width:1640px;height:624px;display:flex;align-items:center;justify-content:center;gap:60px">
  <img src="mark.svg" style="width:250px;height:250px">
  <div><div class="word" style="font-size:120px">Avasetu</div>
  <div style="font-size:44px;margin-top:14px;font-weight:600">Your bridge to the <span class="gold">right home</span></div>
  <div style="font-size:30px;margin-top:16px;opacity:.8">सही घर तक आपका सेतु · योग्य घरापर्यंत तुमचा सेतू</div></div>
</div>
<!-- wordmark horizontal transparent-ish on navy 1600x400 -->
<div id="lockup" class="s navy" style="width:1600px;height:400px;display:flex;align-items:center;gap:44px;padding:0 70px;box-sizing:border-box">
  <img src="mark.svg" style="width:260px;height:260px">
  <div><div class="word" style="font-size:170px">Avasetu</div><div style="font-size:40px;font-weight:600;opacity:.9">Your bridge to the right home</div></div>
</div>
</body></html>
