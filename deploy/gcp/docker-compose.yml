# Avasetu on a single GCP VM: Caddy (auto-HTTPS) -> frontend + backend, MongoDB private.
# Only Caddy publishes ports; Mongo, backend, worker and frontend are reachable only on the internal network.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build: ../../backend
    restart: unless-stopped
    env_file: .env
    environment: &backend_env
      MONGODB_URL: mongodb://app:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      ENVIRONMENT: production
      DEBUG: "false"
      # the public site in captions, footers and links (app/core/brand.py); follows SITE_HOST unless set in .env
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://${SITE_HOST}}
      # the worker service runs the background loops. Roll back: RUN_BACKGROUND_LOOPS=true in .env, then
      # `docker compose up -d backend` (the API runs them again; leases keep it safe while the worker also runs)
      RUN_BACKGROUND_LOOPS: ${RUN_BACKGROUND_LOOPS:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  # Background loops (comment assistant, newsroom, calendar, listing reels): same image and settings as the backend, its
  # own process, so restarting the API does not interrupt them (docs/ARCHITECTURE.md §1). Runner leases keep one copy
  # of each loop running even if the backend runs them too. Needs the uploads volume to render reels.
  worker:
    build: ../../backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend_env
      RUN_BACKGROUND_LOOPS: "true"  # not read by the worker (it always runs the loops); stated so nobody copies "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      disable: true  # the image's check calls the API on :8000; health_check.sh checks the loops' heartbeats instead
    stop_grace_period: 30s  # time to cancel the loops and release their leases

  frontend:
    build:
      context: ../../frontend
      args:
        # set these in deploy/gcp/.env on the VM, then redeploy (they are baked in at build time)
        NEXT_PUBLIC_BUSINESS_NAME: ${NEXT_PUBLIC_BUSINESS_NAME:-Avasetu}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_CONTACT_WHATSAPP: ${NEXT_PUBLIC_CONTACT_WHATSAPP:-}
        NEXT_PUBLIC_SITE_URL: https://${SITE_HOST}
    restart: unless-stopped
    environment:
      SITE_API_URL: http://backend:8000
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
  uploads:
  caddy_data:
  caddy_config:
