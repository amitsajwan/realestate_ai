# Avasetu on a single GCP VM: Caddy (auto-HTTPS) -> frontend + backend, MongoDB private.
# Only Caddy publishes ports; Mongo, backend, the worker roles and frontend are reachable only on the internal network.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5

  backend:
    build: ../../backend
    restart: unless-stopped
    env_file: .env
    environment: &backend_env
      MONGODB_URL: mongodb://app:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      ENVIRONMENT: production
      DEBUG: "false"
      # the public site in captions, footers and links (app/core/brand.py); follows SITE_HOST unless set in .env
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://${SITE_HOST}}
      # the worker roles (conversations, newsroom, media) run the background loops. Roll back: RUN_BACKGROUND_LOOPS=true in .env, then
      # `docker compose up -d backend` (the API runs them again; leases keep it safe while the roles also run)
      RUN_BACKGROUND_LOOPS: ${RUN_BACKGROUND_LOOPS:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  # Each role uses the same image and settings. Runner leases keep one copy of every loop running during deploys or rollback.
  conversations:
    build: ../../backend
    command: ["python", "-m", "app.worker", "--role", "conversations"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend_env
      RUN_BACKGROUND_LOOPS: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 30s
    mem_limit: ${CONVERSATIONS_MEMORY_LIMIT:-512m}
    cpus: ${CONVERSATIONS_CPU_LIMIT:-0.50}

  newsroom:
    build: ../../backend
    command: ["python", "-m", "app.worker", "--role", "newsroom"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend_env
      RUN_BACKGROUND_LOOPS: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 30s
    mem_limit: ${NEWSROOM_MEMORY_LIMIT:-1g}
    cpus: ${NEWSROOM_CPU_LIMIT:-1.00}

  media:
    build: ../../backend
    command: ["python", "-m", "app.worker", "--role", "media"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend_env
      RUN_BACKGROUND_LOOPS: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 30s
    mem_limit: ${MEDIA_MEMORY_LIMIT:-2g}
    cpus: ${MEDIA_CPU_LIMIT:-2.00}

  frontend:
    build:
      context: ../../frontend
      args:
        # set these in deploy/gcp/.env on the VM, then redeploy (they are baked in at build time)
        NEXT_PUBLIC_BUSINESS_NAME: ${NEXT_PUBLIC_BUSINESS_NAME:-Avasetu}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_CONTACT_WHATSAPP: ${NEXT_PUBLIC_CONTACT_WHATSAPP:-}
        NEXT_PUBLIC_SITE_URL: https://${SITE_HOST}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    restart: unless-stopped
    environment:
      SITE_API_URL: http://backend:8000
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
      # other names that redirect to SITE_HOST, e.g. "www.avasetu.in, 34-180-39-243.sslip.io"
      REDIRECT_HOSTS: ${REDIRECT_HOSTS:-www.${SITE_HOST}}
      # names served like SITE_HOST without redirecting, e.g. a new domain while its certificate is issued
      EXTRA_HOSTS: ${EXTRA_HOSTS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
  uploads:
  caddy_data:
  caddy_config:
